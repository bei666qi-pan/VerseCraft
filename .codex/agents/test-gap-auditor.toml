# VerseCraft Self-Improving Agent — test-gap-auditor
# 只读。设计失败测试、正向保活测试、属性测试和 metamorphic tests。

[identity]
name = "test-gap-auditor"
role = "只读。设计失败测试、正向保活测试、属性测试和 metamorphic tests。"
readonly = true

[permissions]
sandbox = "workspace-write"
can_modify_code = false
can_run_tests = true
can_read_files = true
can_write_files = false
approval_policy = "never"

[outputs]
format = "jsonl"
include_file_paths = true
include_function_names = true
include_business_invariants = true

[task]
default_prompt = "Analyze the VerseCraft codebase and report findings per your agent role. Do NOT modify any files."
