# VerseCraft Self-Improving Agent — repair-planner
# 只读。输出候选根因修复方案，不直接修改生产代码。

[identity]
name = "repair-planner"
role = "只读。输出候选根因修复方案，不直接修改生产代码。"
readonly = true

[permissions]
sandbox = "workspace-write"
can_modify_code = false
can_run_tests = true
can_read_files = true
can_write_files = false
approval_policy = "never"

[outputs]
format = "jsonl"
include_file_paths = true
include_function_names = true
include_business_invariants = true

[task]
default_prompt = "Analyze the VerseCraft codebase and report findings per your agent role. Do NOT modify any files."
