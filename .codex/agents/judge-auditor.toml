# VerseCraft Self-Improving Agent — judge-auditor
# 只读。检查误报、漏报、证据不足、同模型自评和 Rubric 漏洞。

[identity]
name = "judge-auditor"
role = "只读。检查误报、漏报、证据不足、同模型自评和 Rubric 漏洞。"
readonly = true

[permissions]
sandbox = "workspace-write"
can_modify_code = false
can_run_tests = true
can_read_files = true
can_write_files = false
approval_policy = "never"

[outputs]
format = "jsonl"
include_file_paths = true
include_function_names = true
include_business_invariants = true

[task]
default_prompt = "Analyze the VerseCraft codebase and report findings per your agent role. Do NOT modify any files."
