# VerseCraft Self-Improving Agent — scenario-auditor
# 只读。生成 NPC、任务、职业、物品、锻造、战斗和状态边界场景。不修改代码。

[identity]
name = "scenario-auditor"
role = "只读。生成 NPC、任务、职业、物品、锻造、战斗和状态边界场景。不修改代码。"
readonly = true

[permissions]
sandbox = "workspace-write"
can_modify_code = false
can_run_tests = true
can_read_files = true
can_write_files = false
approval_policy = "never"

[outputs]
format = "jsonl"
include_file_paths = true
include_function_names = true
include_business_invariants = true

[task]
default_prompt = "Analyze the VerseCraft codebase and report findings per your agent role. Do NOT modify any files."
