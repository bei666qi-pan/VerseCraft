name: Copy ZAFU GitHub Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Copy GITEE_TOKEN to zafu-leave-system
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh secret set GITEE_TOKEN --repo bei666qi-pan/zafu-leave-system --body "$GITEE_TOKEN"
