name: Bootstrap ZAFU Gitee Mirror

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout zafu-leave-system
        uses: actions/checkout@v4
        with:
          repository: bei666qi-pan/zafu-leave-system
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure Gitee repository and deploy key
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/gitee-repo.json -w "%{http_code}" \
            "https://gitee.com/api/v5/repos/bei-qi-luo/zafu-leave-system?access_token=${GITEE_TOKEN}")"
          if [ "$status" = "404" ]; then
            curl -sS -X POST "https://gitee.com/api/v5/user/repos" \
              -d "access_token=${GITEE_TOKEN}" \
              -d "name=zafu-leave-system" \
              -d "private=true" \
              -d "description=ZAFU campus leave system mirror"
          elif [ "$status" != "200" ]; then
            cat /tmp/gitee-repo.json
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ['GITEE_TOKEN']
          owner, repo = 'bei-qi-luo', 'zafu-leave-system'
          key = "ssh-rsa "
          add_url = f'https://gitee.com/api/v5/repos/{owner}/{repo}/keys'
          data = urllib.parse.urlencode({'access_token': token, 'title': 'coolify-minipet-gitee', 'key': key, 'read_only': 'true'}).encode()
          try:
              with urllib.request.urlopen(urllib.request.Request(add_url, data=data, method='POST'), timeout=30) as resp:
                  print('added key', resp.read().decode())
          except Exception as e:
              body = e.read().decode() if hasattr(e, 'read') else str(e)
              print('add key response:', body[:300])
          avail_url = f'https://gitee.com/api/v5/repos/{owner}/{repo}/keys/available?access_token={urllib.parse.quote(token)}'
          with urllib.request.urlopen(avail_url, timeout=30) as resp:
              available = json.loads(resp.read().decode())
          target = None
          for item in available:
              title = item.get('title') or ''
              if 'minipet-gitee' in title or item.get('key','').startswith('ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAACAQDTmk3'):
                  target = item
                  break
          if not target:
              raise SystemExit(f'Could not find deploy key in available list: {available!r}')
          key_id = target['id']
          enable_url = f'https://gitee.com/api/v5/repos/{owner}/{repo}/keys/enable/{key_id}?access_token={urllib.parse.quote(token)}'
          req = urllib.request.Request(enable_url, method='PUT')
          with urllib.request.urlopen(req, timeout=30) as resp:
              print('enabled key', key_id, resp.read().decode())
          PY

      - name: Push main to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/bei-qi-luo/zafu-leave-system.git"
          git config --global http.postBuffer 524288000
          git push --force gitee HEAD:refs/heads/main
