name: AI Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/api/chat/**"
      - "src/lib/ai/**"
      - "src/lib/epistemic/**"
      - "src/lib/evals/**"
      - "src/lib/narrativeEngine/**"
      - "src/lib/npcConsistency/**"
      - "src/lib/playRealtime/**"
      - "src/lib/registry/**"
      - "src/lib/turnEngine/**"
      - "scripts/eval-*.ts"
      - "scripts/assert-eval-report.mjs"
      - "scripts/assert-eval-report.test.mjs"
      - "benchmarks/**"
      - ".github/workflows/ai-quality-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/app/api/chat/**"
      - "src/lib/ai/**"
      - "src/lib/epistemic/**"
      - "src/lib/evals/**"
      - "src/lib/narrativeEngine/**"
      - "src/lib/npcConsistency/**"
      - "src/lib/playRealtime/**"
      - "src/lib/registry/**"
      - "src/lib/turnEngine/**"
      - "scripts/eval-*.ts"
      - "scripts/assert-eval-report.mjs"
      - "scripts/assert-eval-report.test.mjs"
      - "benchmarks/**"
      - ".github/workflows/ai-quality-gate.yml"
  schedule:
    # Twice weekly rather than nightly: keeps drift detection while limiting spend.
    - cron: "43 20 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-quality-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-hard-gates:
    name: offline AI hard gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify report assertion helper
        run: node --test scripts/assert-eval-report.test.mjs

      - name: Verify denial-aware canary logic
        run: pnpm exec tsx --test scripts/eval-live-hallucination-canary.test.ts

      - name: Verify semantic edge canary logic
        run: pnpm exec tsx --test scripts/eval-live-semantic-edge-canary.test.ts

      - name: Validate live canary configurations without network
        run: |
          pnpm exec tsx scripts/eval-live-hallucination-canary.ts --dry-run --repeat 1
          pnpm exec tsx scripts/eval-live-semantic-edge-canary.ts --dry-run

      - name: Detector eval and explicit hard assertion
        run: |
          pnpm eval:detectors:mock
          node scripts/assert-eval-report.mjs \
            --file .runtime-data/eval-detectors-mock.json \
            --require-equal summary.gate=pass

      - name: Narrative style hard gate
        run: pnpm eval:narrative-style:mock

      - name: Red-team detector and judge regressions
        run: pnpm test:red-team && pnpm test:judge

      - name: Multi-turn deterministic regression
        run: pnpm test:playthrough

  live-deepseek-canary:
    name: live DeepSeek hallucination gate
    if: github.event_name != 'pull_request'
    needs: offline-hard-gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      AUTH_SECRET: ci-ai-quality-auth-secret-at-least-32-characters
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      REDIS_URL: ""
      E2E_AI_LIVE: "1"
      BENCHMARK_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      VC_AI_DIRECT_BASE_URL: https://api.deepseek.com
      VC_AI_DIRECT_API_KEY: ${{ secrets.DEEPSEEK_EVAL_API_KEY }}
      VC_AI_DIRECT_MODEL: deepseek-v4-flash
      AI_GATEWAY_BASE_URL: https://api.deepseek.com
      AI_GATEWAY_API_KEY: ${{ secrets.DEEPSEEK_EVAL_API_KEY }}
      AI_MODEL_MAIN: deepseek-v4-flash
      AI_MODEL_CONTROL: deepseek-v4-flash
      AI_MODEL_ENHANCE: deepseek-v4-flash
      AI_MODEL_REASONER: deepseek-v4-flash
      PLAYTEST_LLM_API_KEY: ${{ secrets.DEEPSEEK_EVAL_API_KEY }}
      PLAYTEST_LLM_BASE_URL: https://api.deepseek.com/v1
      PLAYTEST_LLM_MODEL: deepseek-v4-flash
      NEXT_PUBLIC_VERSECRAFT_ENABLE_OPTIONS_REGEN_REPAIR_PASS: "0"
      AI_MAX_RETRIES: "0"
      AI_PLAYER_CHAT_MAX_RETRIES: "0"
      AI_LOG_LEVEL: error
      VERSECRAFT_EVAL_DAILY_CALL_BUDGET: "16"
      VERSECRAFT_EVAL_DISABLE_CACHE: "1"
      VERSECRAFT_ENABLE_MODEL_NARRATIVE_REVIEW_EVALS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm

      - name: Require encrypted evaluation secret
        shell: bash
        run: |
          if [[ -z "${VC_AI_DIRECT_API_KEY:-}" ]]; then
            echo "::error::Missing encrypted GitHub Actions secret DEEPSEEK_EVAL_API_KEY. Live AI checks must not silently skip or reuse an unrelated gateway key."
            exit 1
          fi

      - name: Validate complete live request budget
        shell: bash
        run: |
          # The second options-repair pass is disabled for this workflow. Worst case:
          # 4 hallucination + 2 semantic edge + 3 chat + 3 options regeneration
          # + 1 roster judge + 1 playthrough judge + 1 trace judge = 15 requests.
          planned_requests=$((4 + 2 + 3 + 3 + 1 + 1 + 1))
          hard_limit=16
          echo "Planned top-level live requests: ${planned_requests}/${hard_limit}"
          if (( planned_requests > hard_limit )); then
            echo "::error::Live request plan exceeds the hard budget."
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build production app
        run: pnpm build

      - name: Start application
        shell: bash
        run: |
          mkdir -p .runtime-data/ai-quality
          pnpm exec next start -p 3000 > .runtime-data/ai-quality/next.log 2>&1 &
          echo $! > .runtime-data/ai-quality/next.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat .runtime-data/ai-quality/next.log
          exit 1

      - name: Budgeted live hallucination canary
        run: |
          pnpm exec tsx scripts/eval-live-hallucination-canary.ts \
            --base-url http://127.0.0.1:3000 \
            --repeat 1 \
            --json-out .runtime-data/ai-quality/live-hallucination-canary.json

      - name: Structured fact and open-entity semantic canary
        run: |
          pnpm exec tsx scripts/eval-live-semantic-edge-canary.ts \
            --base-url http://127.0.0.1:3000 \
            --json-out .runtime-data/ai-quality/live-semantic-edge-canary.json

      - name: Short real multi-turn trace
        run: |
          pnpm exec tsx scripts/eval-playthrough-live.ts \
            --live \
            --base-url http://127.0.0.1:3000 \
            --sessions 1 \
            --max-steps 3 \
            --max-live-calls 6 \
            --scenarios happy-speedrun \
            --judge-mode live \
            --parallel 1 \
            --step-delay-ms 1 \
            --stop-on-degrade \
            --out .runtime-data/ai-quality/playthrough

      - name: Require live playthrough judge and strict semantic review
        shell: bash
        run: |
          trace=$(find .runtime-data/ai-quality/playthrough/traces -name '*.json' -print -quit)
          if [[ -z "$trace" ]]; then
            echo "::error::Live playthrough produced no trace."
            exit 1
          fi
          node - "$trace" <<'NODE'
          const fs = require("node:fs");
          const tracePath = process.argv[2];
          const trace = JSON.parse(fs.readFileSync(tracePath, "utf8"));
          if (trace.judgeMode !== "live") {
            console.error(`Expected live playthrough judge, got ${String(trace.judgeMode)}`);
            process.exit(1);
          }
          if (!trace.narrativeConsistency || !Number.isFinite(trace.narrativeConsistency.overallScore)) {
            console.error("Live playthrough judge produced no numeric narrative score.");
            process.exit(1);
          }
          console.log(`Live playthrough judge confirmed: score=${trace.narrativeConsistency.overallScore}`);
          NODE
          pnpm eval:model-narrative-review -- \
            --mode live \
            --input "$trace" \
            --assert-live-coverage \
            --json-out .runtime-data/ai-quality/model-narrative-review.json \
            --markdown-out .runtime-data/ai-quality/model-narrative-review.md
          node scripts/assert-eval-report.mjs \
            --file .runtime-data/ai-quality/model-narrative-review.json \
            --require-true liveCoverageGatePass \
            --require-true summary.strictGatePass

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [[ -f .runtime-data/ai-quality/next.pid ]]; then
            kill "$(cat .runtime-data/ai-quality/next.pid)" 2>/dev/null || true
          fi

      - name: Upload AI quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-quality-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .runtime-data/ai-quality/**
            .runtime-data/budget-state.json
